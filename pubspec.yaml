name: ibudaya
description: "IbuDaya — offline-first energy and arisan bookkeeping for women-led micro-businesses."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # State management (see docs/ARCHITECTURE.md — no other state lib).
  flutter_riverpod: ^3.3.2
  # Navigation (ShellRoute for the bottom-nav shell).
  go_router: ^17.0.0
  # id_ID currency / number / date formatting utilities.
  intl: ^0.20.2
  # Resolves the OS app-documents directory so the user's own records persist
  # across restarts and app updates. Required for offline-first storage; there
  # is no server and no other way to get a writable, backed-up path.
  path_provider: ^2.1.5
  # Live viewfinder with the scan frame for PLN bills and roofs. image_picker
  # alone only launches the system camera, which cannot draw the guide frame.
  camera: ^0.11.2+1
  # "Unggah dari Galeri" — pick an existing photo of a bill or roof.
  image_picker: ^1.2.1
  # On-device OCR that reads kWh and rupiah off the bill photo. Runs offline;
  # no image leaves the phone.
  google_mlkit_text_recognition: ^0.16.0
  # SHA-256 for hashing PINs in local mode. Supabase Auth replaces this later.
  crypto: ^3.0.7
  # Decodes a printed QR/barcode for the demo-data scan path (see
  # lib/features/energy/demo_qr_scan_screen.dart). camera + ML Kit text
  # recognition read prose off a bill; this reads structured demo data
  # reliably at a booth without depending on OCR accuracy on stage.
  mobile_scanner: ^6.0.10
  # HTTP client for BmkgWeatherService (lib/core/weather/) — the one real
  # network call in the app, used only for the opt-in Solar Hub weather
  # panel. Every caller catches failures and hides the panel; nothing else
  # in the app depends on network access (see RT-05 in
  # docs/ASSUMPTIONS_AND_RISKS.md).
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  # Dev-time code generators only (never shipped in the app binary): they
  # render the real IbuDaya mark (assets/icon/) into every Android/iOS
  # launcher-icon density and the native splash screen, replacing the
  # template Flutter icon and the hand-approximated splash mark.
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Assets configuration
  assets:
    - assets/images/
    - assets/icon/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Brand face: Plus Jakarta Sans (SIL OFL 1.1). The .ttf files are not bundled
  # in this environment — see assets/fonts/README.md. Drop them in, uncomment
  # this block, and set AppTypography.fontFamily = 'PlusJakartaSans'.
  # fonts:
  #   - family: PlusJakartaSans
  #     fonts:
  #       - asset: assets/fonts/PlusJakartaSans-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/PlusJakartaSans-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/PlusJakartaSans-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
  #         weight: 800

# Generates the Android/iOS launcher icon from the real IbuDaya mark.
# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#EAF6EF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true

# Generates the native (Android/iOS) branded launch screen from the real
# IbuDaya logo. Run: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FAF9F5"
  image: assets/icon/splash_logo.png
  android_12:
    # Android 12+'s native SplashScreen API renders the icon inside a small,
    # non-configurable safe zone and visibly clips anything outside it — the
    # adaptive-icon foreground (content at 62%) still got its top clipped, so
    # this dedicated asset keeps content to ~42% for a wide safety margin.
    color: "#FAF9F5"
    image: assets/icon/splash_icon_android12.png
  android: true
  ios: true
  web: false
  fullscreen: true
